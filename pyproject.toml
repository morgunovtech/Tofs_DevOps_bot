[project]
name = "tofsdevops"
version = "2.0.0"
description = "Personal DevOps in Telegram: monitoring, SEO/GEO visibility, self-healing"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".claude", "data", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "db", "handlers", "monitors", "reports", "services", "utils", "web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:aiogram", "ignore::DeprecationWarning"]
