[project]
name = "tofsdevops"
version = "2.0.0"
description = "Personal DevOps in Telegram (the bot speaks Russian): monitoring, SEO/GEO visibility, self-healing"
# <3.15: aiogram 3.31 allows Python below 3.15 only, and pydantic-core of
# pydantic 2.13 has no 3.15 wheels — lift once aiogram allows both.
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["main", "config"]
packages = ["db", "handlers", "monitors", "reports", "services", "utils", "web"]
package-data = { web = ["templates/*.html", "feedback-widget.js"] }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".claude", "data", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "db", "handlers", "monitors", "reports", "services", "utils", "web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
# pytest applies these in order and the LAST matching one wins: the general
# rule first, the exception for aiogram last.
filterwarnings = ["default::DeprecationWarning", "error::DeprecationWarning:aiogram"]
