[project]
name = "tofsdevops"
version = "3.1.0"
description = "Personal DevOps in Telegram (Russian or English UI): monitoring, SEO/GEO visibility, self-healing"
# <3.15: aiogram 3.32 allows Python 3.15 and pydantic 2.14, but the lock still
# holds pydantic 2.13, whose pydantic-core 2.46 has no 3.15 wheels — lift once
# the lock moves to pydantic >= 2.14 and CI tests on 3.15.
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = ["main", "config"]
packages = ["db", "handlers", "locales", "locales.en", "monitors", "reports", "services", "utils", "web"]
package-data = { web = ["templates/*.html", "feedback-widget.js"] }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".claude", "data", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "db", "handlers", "locales", "monitors", "reports", "services", "utils", "web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
# pytest applies these in order and the LAST matching one wins: the general
# rule first, the exception for aiogram last.
filterwarnings = ["default::DeprecationWarning", "error::DeprecationWarning:aiogram"]
