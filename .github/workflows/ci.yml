name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint · test · audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # Known vulnerabilities in the pinned dependencies fail the build —
      # that is the point: a Dependabot bump is the fix.
      - run: pip-audit -r requirements.txt --strict --progress-spinner off
      # The image itself, on a leg that branch protection requires: tests pass
      # on the runner's Python, but a Dependabot bump of the base image (or a
      # package without wheels for it) only breaks here — and must not be
      # auto-merged into a deploy that fails.
      - if: matrix.python == '3.13'
        run: docker build --quiet --tag devops-bot-ci .
