# Dependabot opens one grouped PR per week with every Python update, plus
# monthly PRs for the base image and the Actions. CI tests them; the
# auto-merge workflow merges minor/patch bumps once CI is green, and the
# hosting platform redeploys from main. The bot then reports «🔄 Бот
# обновился» on its next start.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: saturday
    groups:
      python-deps:
        patterns: ["*"]
    labels: ["dependencies"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # aiogram 3.31 caps Python below 3.15, so the 3.15 image does not build
    # (01.11.2026). Drop this once aiogram supports 3.15.
    ignore:
      - dependency-name: python
        versions: [">=3.15"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
