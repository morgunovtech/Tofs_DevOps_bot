# Dependabot opens one grouped PR per week with every Python update, plus
# monthly PRs for the base image and the Actions. CI tests them; the
# auto-merge workflow merges only patch/minor bumps of the Python libraries
# once CI is green, and the hosting platform redeploys from main. The bot
# then reports «🔄 Бот обновился» on its next start. The base image (a new
# Python), the Actions and major bumps wait for a human. A version reaches
# a PR no sooner than 7 days after its release (cooldown; security updates
# are not delayed).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: saturday
      # Outside the bot's daily-task windows (03:30–03:45 and 07:30–09:00
      # bot time): the redeploy after the merge restarts the bot.
      time: "13:00"
      timezone: Europe/Moscow
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      python-deps:
        patterns: ["*"]
    labels: ["dependencies"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # 3.14, not 3.15: aiogram 3.31 allows Python below 3.15 only, and the
    # pydantic-core of pydantic 2.13 has no 3.15 wheels (the 3.15 bump of
    # 01.11.2026 did not build) — drop this once an aiogram release allows
    # both Python 3.15 and pydantic >= 2.14. The monthly PR moves the digest
    # in the Dockerfile's FROM; a human merges it (PLAN-23 policy).
    ignore:
      - dependency-name: python
        versions: [">=3.15"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
