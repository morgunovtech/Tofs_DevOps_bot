<!doctype html>
<html lang="$lang" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="60">
<meta name="theme-color" content="#edeae5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
<title>$title</title>
<style>
  /* morgunov.tech design system v1: tokens.css and fonts.css from the vendored
     copy in web/s.morgunov.tech (web/status_page.py inlines them — the status
     page of a self-hosted bot depends on nothing outside for its colours and
     type; the woff2 files load from the origin with swap, the system stack
     stands in until they arrive, or for good). The status colours below are the
     page's own: the DS has no semantic palette; the same values Fingerprint uses. */
$ds_css
  :root { --ok: #27703f; --warn: #8a5a00; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) {
    [data-theme="auto"] { --ok: #6cc08a; --warn: #e2a93b; --bad: #ff7a6e; }
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--v4-bg); color: var(--v4-fg);
    font-family: var(--v4-sans); font-size: 14px; line-height: 1.55; letter-spacing: -0.005em;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 36px 24px 56px; }
  :focus-visible { outline: 2px solid var(--v4-orange); outline-offset: 2px; }
  /* Uppercase tracked labels: the DS micro-label scale (mono = numbers and meta). */
  .page-title, .uptime, .incidents th, footer {
    font-family: var(--v4-mono); font-weight: var(--v4-label-weight); text-transform: uppercase;
    color: var(--v4-muted);
  }
  .page-title { font-size: var(--v4-label-size); letter-spacing: var(--v4-label-tracking); margin: 0 0 12px; }
  /* The verdict: a paper block under the page rule, a square status mark before the words.
     No coloured fills — the DS keeps colour for text, lines and marks. */
  .banner {
    display: flex; align-items: center; gap: 14px; margin: 0 0 24px; padding: 16px 18px;
    border: 1px solid var(--v4-fg); background: var(--v4-paper);
    font-size: 18px; font-weight: 600; letter-spacing: -0.01em;
  }
  .banner::before { content: ""; width: 10px; height: 10px; flex: none; background: var(--v4-dim); }
  .banner-up::before { background: var(--ok); animation: pulse 2.4s ease-in-out infinite; }
  .banner-down::before { background: var(--bad); }
  .banner-warn::before { background: var(--warn); }
  .banner-down { border-color: var(--bad); }
  .banner-warn { border-color: var(--warn); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .site { background: var(--v4-paper); border: 1px solid var(--v4-line); padding: 14px 16px; margin-bottom: 8px; }
  .site-head { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; flex: none; background: var(--v4-dim); }
  .dot-up { background: var(--ok); }
  .dot-down { background: var(--bad); }
  .dot-warn { background: var(--warn); }
  .problems { margin-top: 4px; color: var(--warn); font-size: 13px; }
  .site-name { font-weight: 600; overflow-wrap: anywhere; }
  .site-state { margin-left: auto; color: var(--v4-muted); font-family: var(--v4-mono); font-size: 12px; white-space: nowrap; }
  .uptime { margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--v4-label-size); letter-spacing: 0.04em; }
  .good { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .na { color: var(--v4-dim); }
  h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin: 32px 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--v4-fg); }
  .incidents { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--v4-paper); border: 1px solid var(--v4-line); }
  .incidents th, .incidents td { text-align: left; padding: 8px 12px; vertical-align: top; border-bottom: 1px solid var(--v4-line-soft); }
  .incidents tr:last-child td { border-bottom: none; }
  .incidents th { font-size: var(--v4-label-xs-size); letter-spacing: var(--v4-label-xs-tracking); border-bottom-color: var(--v4-line); }
  .inc-open { color: var(--bad); font-weight: 600; }
  footer {
    margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--v4-line);
    display: flex; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap;
    font-size: var(--v4-label-xs-size); letter-spacing: var(--v4-label-xs-tracking);
  }
  /* A phone: incidents as a list, the duration column first — no sideways scroll;
     a long state (degraded · 120 ms) goes under the name, not beside it. */
  @media (max-width: 560px) {
    .wrap { padding: 20px 16px 32px; }
    .banner { font-size: 16px; padding: 14px; }
    .site-head { flex-wrap: wrap; }
    .site-state { margin-left: 18px; white-space: normal; width: 100%; }
    .incidents, .incidents tbody, .incidents tr, .incidents td { display: block; width: auto; }
    .incidents thead { display: none; }
    .incidents td { border: none; padding: 2px 12px; overflow-wrap: anywhere; }
    .incidents tr { padding: 8px 0; border-bottom: 1px solid var(--v4-line-soft); }
    .incidents tr:last-child { border-bottom: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  $heading
  <h1 class="banner $banner_cls">$banner</h1>
  $sites_html
  $incidents_html
  <footer><span>$checked · $built</span><span>TofsDevOps</span></footer>
</main>
</body>
</html>
