services:
  bot:
    build: .
    container_name: tofs_devops
    restart: always
    env_file: .env
    volumes:
      - bot_data:/app/data
      # Uncomment to enable container auto-restart and disk auto-cleanup on
      # this host (AUTORESTART_CONTAINERS / AUTO_CLEANUP in .env).
      # NOTE: the docker socket is root-equivalent access to the host —
      # enable only on a single-purpose server you fully control.
      # - /var/run/docker.sock:/var/run/docker.sock
      # Google Search Console service-account key (see .env.example):
      # - ./gsc-key.json:/app/gsc-key.json:ro
    ports:
      # The web server (feedback widget, heartbeats, status page) is exposed
      # on every interface so the widget on your sites can reach it. Put a
      # reverse proxy with TLS in front (and set TRUST_PROXY=1), or bind to
      # localhost only: "127.0.0.1:8080:8080".
      - "8080:8080"
    environment:
      - DB_PATH=/app/data/bot.db

volumes:
  bot_data:
    driver: local
