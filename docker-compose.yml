services:
  bot:
    build: .
    container_name: tofs_devops
    restart: always
    env_file: .env
    volumes:
      - bot_data:/app/data
      # Uncomment to enable container auto-restart and disk auto-cleanup on
      # this host (AUTORESTART_CONTAINERS / AUTO_CLEANUP in .env).
      # NOTE: the docker socket is root-equivalent access to the host —
      # enable only on a single-purpose server you fully control.
      # - /var/run/docker.sock:/var/run/docker.sock
      # Google Search Console service-account key (see .env.example):
      # - ./gsc-key.json:/app/gsc-key.json:ro
    ports:
      # The bot's web server (feedback widget, heartbeats, status page) speaks
      # plain HTTP, so only this machine may reach it. Put a reverse proxy with
      # TLS in front (README → «Public address on your own server») and set
      # TRUST_PROXY=1 in .env. Do not change this to "8080:8080": a port
      # published by Docker bypasses ufw, the heartbeat secret then travels in
      # the clear, and anyone can forge X-Forwarded-For.
      - "127.0.0.1:${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"
    environment:
      - DB_PATH=/app/data/bot.db

volumes:
  bot_data:
    driver: local
