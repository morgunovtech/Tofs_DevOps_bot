version: "3.9"

services:
  bot:
    build: .
    container_name: devops_bot
    restart: always
    env_file: .env
    volumes:
      - bot_data:/app/data
    ports:
      - "8080:8080"   # webhook endpoint (feedback from sites)
    environment:
      - DB_PATH=/app/data/bot.db

volumes:
  bot_data:
    driver: local
